name: Publish LLM Book

on:
  push:
    branches:
      - main
    paths:
      - "pixi.lock"
      - "book/**"
  pull_request:
    branches:
      - main
    paths:
      - "pixi.lock"
      - "book/**"

permissions:
  id-token: write
  contents: write

jobs:
  # Note: only deploys on push to main
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.modular
            ~/.cache/modular
          key: ${{ runner.os }}-modular-${{ hashFiles('**/pixi.toml') }}

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e
        with:
          pixi-version: v0.82.1
          cache: false
          post-cleanup: false

      - name: Format code
        shell: bash
        run: |
          pixi run fmt

      - name: Build
        shell: bash
        run: |
          cd book
          pixi run build-book

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./book/html
          cname: llm.modular.com
          allow_empty_commit: true
