[book]
title = "Build and serve an LLM with MAX"
authors = ["Modular <hello@modular.com>"]
description = "Go from zero to serving: run a small LLM with MAX, rebuild it from scratch with max.nn and max.functional, then add sampling, a KV cache, batching and your own server."
src = "src"
language = "en"
text-direction = "ltr"

[output.html]
additional-css = [
    "theme/css/custom.css",
    "theme/css/highlight.css",
]
additional-js = [
    "theme/code-highlighting.js",
    "theme/sidebar.js",
    "theme/init-amplitude.js",
    "theme/warning.js",
    "theme/plotly-figures.js",
]
default-theme = "light"
preferred-dark-theme = "ayu"
copy-fonts = true
favicon_svg=true
smart-punctuation = true
no-section-label = true
git-repository-url = "https://github.com/modular/max-llm-book"
mathjax-support = true
theme-switcher = true
no-theme-selection = false
draft = false

[output.html.highlight]
enable = true

[output.html.print]
enable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = false

[build]
build-dir = "html"
create-missing = false

[preprocessor.index]
index = false

[preprocessor.links]
# Enables use of {{#include file.md}} to include other files
renderers = ["html"]
